<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predecir Promedio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand">Sistema de Gestión de Alumnos</span>
        <a href="{{ url_for('alumnos.listar_alumnos') }}" class="btn btn-outline-light btn-sm">Volver</a>
    </nav>

    <div class="container mt-5" style="max-width: 400px;">
        <h2 class="mb-4 text-center">Predecir Promedio</h2>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nota 1</label>
                <input type="number" step="0.1" name="nota_1" class="form-control" min="0" max="10" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nota 2</label>
                <input type="number" step="0.1" name="nota_2" class="form-control" min="0" max="10" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Asistencia (0-30)</label>
                <input type="number" name="asistencia" class="form-control" min="0" max="30" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Predecir</button>
        </form>

        {% if prediccion is not none %}
            <div class="alert alert-success mt-4 text-center">
                <h4>Promedio estimado: <strong>{{ prediccion }}</strong></h4>
            </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
