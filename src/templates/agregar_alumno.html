<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand">Sistema de Gestión de Alumnos</span>
        <a href="{{ url_for('alumnos.listar_alumnos') }}" class="btn btn-outline-light btn-sm">Volver</a>
    </nav>

    <div class="container mt-5" style="max-width: 500px;">
        <h2 class="mb-4 text-center">Agregar Alumno</h2>

        <form method="POST" action="/alumnos/nuevo">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ ]+" title="Solo letras" placeholder="Nombre" required>           
            </div>

            <div class="mb-3">
                <label class="form-label">Apellido</label>
                <input type="text" name="apellido" class="form-control" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ ]+" title="Solo letras" placeholder="Apellido" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Edad</label>
                <input type="number" name="edad" class="form-control" min="1" max="100" placeholder="Edad" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nota 1</label>
                <input type="number" step="0.1" name="nota_1" class="form-control" min="0" max="10" placeholder="Nota 1" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nota 2</label>
                <input type="number" step="0.1" name="nota_2" class="form-control" min="0" max="10" placeholder="Nota 2" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Asistencia (0-30)</label>
                <input type="number" name="asistencia" class="form-control" min="0" max="30" placeholder="Asistencia" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Guardar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
